# Migrations du schéma. L'URL vient de DATABASE_URL (voir migrations/env.py).
# Commandes (dans le conteneur api) :
#   alembic upgrade head                        # appliquer (fait aussi au démarrage de l'API)
#   alembic revision --autogenerate -m "..."    # créer une migration depuis les modèles
#   alembic check                               # échoue si les modèles divergent de la base
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
